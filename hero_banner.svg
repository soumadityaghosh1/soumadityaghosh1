<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soumaditya Ghosh — B.Tech CSE student, Python and AI intern, computer vision learner">
  <style>
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes dash { to { stroke-dashoffset: -64 } }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes drift { 0% { transform: translateX(0) } 100% { transform: translateX(40px) } }
    .cursor { animation: blink 1.1s step-end infinite; }
    .lane { animation: dash 1.6s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030817"/>
      <stop offset="55%" stop-color="#0b1a3d"/>
      <stop offset="100%" stop-color="#050b1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf8"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60a5fa" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <g class="drift"><ellipse cx="220" cy="80" rx="300" ry="170" fill="url(#blobA)"/></g>
  <ellipse cx="1010" cy="250" rx="320" ry="160" fill="url(#blobB)"/>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#1e3a8a" stroke-width="2"/>

  <!-- window bar -->
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>
  <text x="92" y="33" class="mono" font-size="13" fill="#6b7fa6">C:\Users\soumaditya\README.md</text>
  <text x="1176" y="33" text-anchor="end" class="mono" font-size="13" fill="#6b7fa6">&gt; initializing profile<tspan class="cursor" fill="#38bdf8">_</tspan></text>

  <!-- lane-detection motif (bottom centre) -->
  <path d="M560 300 L596 206 L604 206 L640 300 Z" fill="url(#road)"/>
  <path d="M596 206 L520 300" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M604 206 L680 300" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2.5"/>
  <path class="lane" d="M600 210 L600 300" stroke="#e6edf8" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="10 22"/>

  <!-- forecast motif (right) -->
  <polyline points="860,262 900,250 940,256 980,236 1020,242 1060,222" fill="none" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2.5"/>
  <polyline points="1060,222 1100,210 1140,200 1180,186" fill="none" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="1060" cy="222" r="5" fill="#050b1f" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- data bars (left) -->
  <g fill="#2563eb" opacity="0.35">
    <rect x="30" y="258" width="14" height="42"/><rect x="52" y="240" width="14" height="60"/><rect x="74" y="250" width="14" height="50"/>
    <rect x="96" y="226" width="14" height="74"/><rect x="118" y="244" width="14" height="56"/><rect x="140" y="232" width="14" height="68"/>
    <rect x="162" y="254" width="14" height="46"/><rect x="184" y="218" width="14" height="82"/><rect x="206" y="246" width="14" height="54"/>
  </g>

  <!-- side monogram -->
  <text x="30" y="110" class="sans" font-size="22" font-weight="900" fill="#38bdf8" opacity="0.5">S</text>
  <text x="30" y="138" class="sans" font-size="22" font-weight="900" fill="#38bdf8" opacity="0.5">G</text>
  <circle class="pulse" cx="37" cy="158" r="4" fill="#38bdf8"/>

  <!-- title -->
  <text x="600" y="118" text-anchor="middle" class="sans" font-size="62" font-weight="900" letter-spacing="5" fill="url(#title)" filter="url(#glow)">SOUMADITYA GHOSH</text>
  <text x="600" y="156" text-anchor="middle" class="sans" font-size="19" fill="#e6edf8">B.Tech CSE Student  •  Python &amp; AI Intern  •  Computer Vision Learner</text>
  <text x="600" y="188" text-anchor="middle" class="mono" font-size="15" letter-spacing="1.5" fill="#7dd3fc">[ BUILDING AT THE EDGE OF SOFTWARE &amp; AI ]</text>
  <rect x="400" y="200" width="400" height="2" fill="url(#line)"/>
</svg>
